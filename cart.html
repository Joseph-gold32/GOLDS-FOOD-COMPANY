<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Foods — Your Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">GF</div>
    <span class="logo-text">Gold Foods</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="cart.html" class="active cart-badge">Cart <span class="badge" style="display:none">0</span></a></li>
    <li><a href="auth.html" class="nav-cta">Sign In</a></li>
  </ul>
  <div class="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="page-header">
  <div class="container" style="position:relative;z-index:2">
    <span class="section-label">Your Order</span>
    <h1 class="section-title">Your <span>Cart</span></h1>
    <p class="section-subtitle" style="margin:0 auto">Review your items and proceed to checkout.</p>
  </div>
</div>

<section style="background:var(--dark);padding-top:3rem">
  <div class="container">
    <div class="cart-layout">
      <div>
        <div id="cart-items"></div>
      </div>
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal-price">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Delivery Fee</span>
          <span id="delivery-price">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Discount</span>
          <span style="color:#4CAF50">-$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total-price">$0.00</span>
        </div>

        <div style="margin:1.5rem 0">
          <div class="form-group">
            <label>Promo Code</label>
            <div style="display:flex;gap:.5rem">
              <input type="text" placeholder="e.g. GOLD20" id="promo-input">
              <button onclick="applyPromo()" class="btn btn-sm btn-primary">Apply</button>
            </div>
          </div>
        </div>

        <button onclick="checkout()" class="btn btn-primary" style="width:100%;justify-content:center;padding:1rem">
          Place Order →
        </button>
        <a href="menu.html" class="btn btn-dark" style="width:100%;justify-content:center;margin-top:.75rem">
          ← Continue Shopping
        </a>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <p>&copy; 2024 Gold Foods. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="app.js"></script>
<script>
function applyPromo() {
  const code = document.getElementById('promo-input').value.trim().toUpperCase();
  if (code === 'GOLD20') {
    showToast('20% discount applied! 🎉');
  } else {
    showToast('Invalid promo code.', '❌');
  }
}
</script>
</body>
</html>
